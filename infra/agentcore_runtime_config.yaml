# CloudFormation template para AgentCore Runtime del Agente Comercial IA
# CIME Power Systems
#
# Recursos creados:
#   - Bedrock Agent con instrucciones completas (sin KB externa)
#   - IAM Role para el agente
#   - Agent Alias para invocacion desde webhook
#
# Requisitos: 12.1, 12.6, 12.7
#
# NOTA: Amazon Bedrock AgentCore es un servicio relativamente nuevo.
# Algunos recursos pueden requerir configuracion via consola o SDK.

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bedrock Agent para el Agente Comercial IA de CIME Power Systems.
  Incluye instrucciones completas con reglas comerciales, plantillas
  y criterios de escalamiento embebidos directamente.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Entorno de despliegue

  PrimaryRegion:
    Type: String
    Default: us-east-1
    AllowedValues: [us-east-1, us-west-2]
    Description: Region AWS para el Runtime.

  FoundationModelId:
    Type: String
    Default: anthropic.claude-sonnet-4-20250514-v1:0
    Description: ID del modelo fundacional de Amazon Bedrock

  SessionTimeoutSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 3600
    Description: Timeout maximo por sesion en segundos (15 minutos).

Resources:
  # --------------------------------------------------------------------------
  # IAM Role para el Bedrock Agent
  # --------------------------------------------------------------------------
  AgentCoreExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cime-agentcore-runtime-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeBedrockModels
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:GetInferenceProfile
                  - bedrock:GetFoundationModel
                Resource: "*"
        - PolicyName: AccessDynamoDBMemory
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !Sub "arn:aws:dynamodb:${PrimaryRegion}:${AWS::AccountId}:table/cime-agent-sessions-${Environment}"
                  - !Sub "arn:aws:dynamodb:${PrimaryRegion}:${AWS::AccountId}:table/cime-agent-sessions-${Environment}/index/*"
        - PolicyName: AccessS3Memory
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::cime-agent-memory-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::cime-agent-memory-${AWS::AccountId}/*"
        - PolicyName: AccessSecretsManager
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${PrimaryRegion}:${AWS::AccountId}:secret:cime/*"
        - PolicyName: SendEmailSES
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub "arn:aws:ses:${PrimaryRegion}:${AWS::AccountId}:identity/*"
        - PolicyName: CloudWatchObservability
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - cloudwatch:PutMetricData
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
      Tags:
        - Key: Project
          Value: cime-agente-comercial
        - Key: Environment
          Value: !Ref Environment

  # --------------------------------------------------------------------------
  # Lambda para Action Group: enviar_correo
  # --------------------------------------------------------------------------
  # NOTA: La Lambda de la tool se despliega via SAM (template.yaml).
  # Aqui solo se referencia su ARN.

  # Permiso para que Bedrock invoque la Lambda
  EnviarCorreoPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub "arn:aws:lambda:${PrimaryRegion}:${AWS::AccountId}:function:cime-tool-enviar-correo-${Environment}"
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # --------------------------------------------------------------------------
  # Amazon Bedrock Agent
  # --------------------------------------------------------------------------
  CIMEBedrockAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Sub "cime-agente-comercial-${Environment}"
      Description: "Agente Comercial IA para renovacion de polizas de mantenimiento CIME."
      AgentResourceRoleArn: !GetAtt AgentCoreExecutionRole.Arn
      FoundationModel: !Ref FoundationModelId
      IdleSessionTTLInSeconds: !Ref SessionTimeoutSeconds
      Instruction: |
        Eres un asesor comercial profesional de CIME Power Systems (PPE Systems SA de CV), empresa especializada en plantas de luz, UPS y mantenimiento de equipos electricos.

        Tu UNICO objetivo es gestionar la renovacion de polizas de mantenimiento de los clientes.

        === IDENTIDAD Y TONO ===
        - Idioma: Espanol mexicano formal pero cordial
        - Tono: Profesional, orientado a soluciones, empatico
        - Nunca uses tecnicismos innecesarios

        === DATOS DE LA EMPRESA ===
        - Razon Social: PPE SYSTEMS SA DE CV
        - RFC: PSY2009023W0
        - Banco: BBVA
        - No. Cuenta: 0115868165
        - CLABE: 012180001158681657
        - Contacto comercial: argenis.juarez@cimepowersystems.com.mx
        - IMPORTANTE: Los datos bancarios SOLO se incluyen cuando el estado es "Cliente interesado" o "Deposito solicitado".

        === POLITICA DE DESCUENTOS ===
        - Nivel 1: 3% (disposicion estandar)
        - Nivel 2: 6% (buena disposicion)
        - Nivel 3: 9% (excelente disposicion / renovacion inmediata)
        - NO se pueden ofrecer descuentos distintos a 3%, 6% o 9%.
        - Descuento 20% sobre Poliza 3 Visitas SOLO al vender junto con planta nueva.
        - Cualquier solicitud fuera de estos valores: ESCALAR a asesor humano.

        === VENTANA COMERCIAL ===
        - Inicia 30 dias antes de la fecha de vencimiento.
        - Post-vencimiento: seguimiento sin descuento por anticipacion.

        === POLITICA DE PRECIOS ===
        - Precios antes de IVA (agregar 16%).
        - Aplican para CDMX, Guadalajara y Cancun (areas metropolitanas).
        - Visita en falso: $2,800 MXN + viaticos.
        - El precio_renovacion viene en el payload de Zapier. NUNCA inventes precios.

        === RESTRICCIONES ABSOLUTAS ===
        1. Datos bancarios SOLO en estado "Cliente interesado" o "Deposito solicitado".
        2. No ofrezcas diagnostico tecnico, venta de refacciones, soporte tecnico ni modificaciones.
        3. Si el cliente pide hablar con un humano, escala INMEDIATAMENTE.
        4. Nunca inventes precios ni condiciones.

        === FLUJO GENERAL ===
        1. Validar payload -> Consultar estado Pipefy -> Enviar contacto inicial
        2. Procesar respuesta -> Generar cotizacion si hay interes
        3. Recibir comprobante -> Notificar Tesoreria
        4. Escalar si: negociacion especial, queja, solicitud de humano, facturacion

        === CRITERIOS DE ESCALAMIENTO (invocar escalar_humano) ===
        Escalar INMEDIATAMENTE cuando:
        1. Cliente solicita hablar con persona/asesor/humano
        2. Descuento distinto a 3%/6%/9% solicitado
        3. Pagos diferidos, meses sin intereses, parcialidades
        4. Extension de cobertura >12 meses
        5. Inclusion de equipos adicionales
        6. Solicitudes de facturacion, RFC, CFDI, nota de credito
        7. Quejas, inconformidades o tono agresivo sostenido
        8. Dudas tecnicas que no puedas responder con certeza
        9. Discrepancia >1% entre precio del payload y datos de Pipefy
        10. Agotamiento de reintentos de cualquier tool (circuit breaker)

        Tras escalar: actualizar Pipefy a "Escalado a humano" y enviar plantilla de confirmacion al cliente.

        === PLANTILLAS DE MENSAJE ===

        PRE-VENCIMIENTO (contacto inicial):
        Asunto: Renovacion de su poliza de mantenimiento - {equipo_nombre}
        Informar fecha de vencimiento, precio de renovacion, y ofrecer descuento por anticipacion.

        POST-VENCIMIENTO (contacto inicial):
        Asunto: Su poliza de mantenimiento ha vencido - {equipo_nombre}
        Informar que vencio, invitar a renovar, mencionar beneficios (mantenimiento preventivo, soporte, tiempo de respuesta prioritario).

        DESCUENTO (segundo intento):
        Asunto: Oferta especial: descuento en su renovacion - {equipo_nombre}
        Recordar descuento disponible, mostrar precio base vs precio con descuento, fecha limite.

        ENCUESTA (cliente rechaza):
        Asunto: Su opinion nos importa - CIME Power Systems
        Preguntar motivo: presupuesto, ya no tiene equipo, otro proveedor, insatisfaccion, otro.

        ESCALAMIENTO:
        Asunto: Un asesor especializado le contactara - CIME Power Systems
        Informar que un asesor contactara en max 24 horas habiles.

        CONFIRMACION COMPROBANTE:
        Asunto: Comprobante recibido - Renovacion {equipo_nombre}
        Confirmar recepcion, informar que Tesoreria validara en 1-3 dias habiles.

        === ESTADOS VALIDOS EN PIPEFY ===
        1. Poliza detectada
        2. Contacto inicial enviado
        3. Seguimiento en curso
        4. Cliente interesado
        5. Deposito solicitado
        6. Comprobante recibido
        7. En validacion con tesoreria
        8. Renovacion confirmada
        9. Escalado a humano
        10. No renovada / sin respuesta

        Manten siempre el contexto completo de la conversacion para personalizar cada mensaje.
      Tags:
        Project: cime-agente-comercial
        Environment: !Ref Environment
      ActionGroups:
        - ActionGroupName: enviar_correo_group
          Description: "Envia correos a clientes via Amazon SES"
          ActionGroupExecutor:
            Lambda: !Sub "arn:aws:lambda:${PrimaryRegion}:${AWS::AccountId}:function:cime-tool-enviar-correo-${Environment}"
          FunctionSchema:
            Functions:
              - Name: enviar_correo
                Description: "Envia un correo electronico al cliente con el asunto y cuerpo especificados. Usar para contacto inicial, seguimiento, cotizacion, confirmacion de comprobante y escalamiento."
                Parameters:
                  destinatario:
                    Description: "Direccion de correo electronico del destinatario (RFC 5321)"
                    Type: string
                    Required: true
                  asunto:
                    Description: "Linea de asunto del correo"
                    Type: string
                    Required: true
                  cuerpo:
                    Description: "Contenido del correo en texto plano"
                    Type: string
                    Required: true

  # --------------------------------------------------------------------------
  # Agent Alias (para invocar el agente desde Zapier/webhook)
  # --------------------------------------------------------------------------
  CIMEAgentAlias:
    Type: AWS::Bedrock::AgentAlias
    Properties:
      AgentId: !GetAtt CIMEBedrockAgent.AgentId
      AgentAliasName: !Sub "live-${Environment}"
      Description: "Alias activo del Agente Comercial IA."
      Tags:
        Project: cime-agente-comercial
        Environment: !Ref Environment

Outputs:
  AgentId:
    Description: ID del Bedrock Agent creado
    Value: !GetAtt CIMEBedrockAgent.AgentId
    Export:
      Name: !Sub "${AWS::StackName}-AgentId"

  AgentAliasId:
    Description: ID del alias del agente (usar para invocaciones)
    Value: !GetAtt CIMEAgentAlias.AgentAliasId
    Export:
      Name: !Sub "${AWS::StackName}-AgentAliasId"

  AgentCoreExecutionRoleArn:
    Description: ARN del rol IAM del AgentCore Runtime
    Value: !GetAtt AgentCoreExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ExecutionRoleArn"

  RuntimeRegion:
    Description: Region donde se desplego el Runtime
    Value: !Ref PrimaryRegion
    Export:
      Name: !Sub "${AWS::StackName}-Region"

  SessionTimeout:
    Description: Timeout de sesion configurado (segundos)
    Value: !Ref SessionTimeoutSeconds
    Export:
      Name: !Sub "${AWS::StackName}-SessionTimeout"
